<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- viewport-fit=cover no: la app no dibuja hasta el borde y con el
         notch quedaria contenido debajo de la barra del sistema. -->
    <title>Mapa de Pensum — UDO Núcleo de Monagas</title>
    <meta
      name="description"
      content="Mapa interactivo de los pensums de la Universidad de Oriente, Núcleo de Monagas. Nueve carreras con sus materias, prelaciones y avance."
    />
    <link rel="canonical" href="https://mapa-pensum.vercel.app/" />
    <!-- Vista previa al pegar el enlace en WhatsApp, Telegram, Discord o X.
         La URL de la imagen tiene que ser absoluta: WhatsApp no resuelve
         rutas relativas. Declarar ancho y alto evita que recorte mal
         mientras la descarga. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mapa de Pensum" />
    <meta property="og:url" content="https://mapa-pensum.vercel.app/" />
    <meta property="og:title" content="Mapa de Pensum — UDO Núcleo de Monagas" />
    <meta
      property="og:description"
      content="Tu carrera como un mapa: qué materia desbloquea cuál y cuánto te falta. Nueve carreras del Núcleo de Monagas."
    />
    <meta property="og:image" content="https://mapa-pensum.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mapa de Pensum: las nueve carreras del Núcleo de Monagas, cada una con la silueta de su plan de estudios."
    />
    <meta property="og:locale" content="es_VE" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- El color de fondo se fija antes de pintar para que no haya un
         fogonazo blanco al cargar en tema oscuro -->
    <meta name="theme-color" content="#05080e" />

    <!--
      El tema se decide AQUI, antes de que se pinte el primer pixel, y esta
      es la unica razon por la que este script existe suelto en el HTML.

      La paleta por defecto del CSS es la oscura: el tema claro entra cuando
      <html> lleva data-tema="claro", y eso lo ponia un efecto de React. O
      sea que hasta que el JavaScript no arrancaba, la pagina se pintaba
      NEGRA aunque el usuario tuviera el tema claro elegido, y al montar la
      aplicacion daba el salto a blanco. Ese era el destello de entrada.

      Tiene que ir inline y sin type="module": un modulo se aplaza hasta
      despues de analizar el documento, que es justo lo que hay que evitar.
      Un script clasico dentro del head corre al leerlo y bloquea el pintado
      esos microsegundos, que es exactamente lo que se quiere.

      Repite la regla que aplica useTema -lo guardado manda, y si no hay
      nada, lo que pida el sistema-. Es la unica duplicacion del proyecto que
      no se puede evitar importando: importar significaria aplazar, y aplazar
      es el fallo. Si la regla cambia, hay que cambiarla en los dos sitios.

      El try es obligatorio y ya sabemos por que: con los datos de sitio
      bloqueados, leer localStorage lanza. Sin el, este script reventaria
      antes de que existiera la aplicacion y no habria ni limite de error que
      lo recogiera.
    -->
    <script>
      ;(function () {
        var tema
        try {
          tema = localStorage.getItem('mapa-pensum:tema')
        } catch (e) {
          /* Sin almacen se decide por lo que pida el sistema */
        }
        if (tema !== 'claro' && tema !== 'oscuro') {
          tema = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro'
        }
        document.documentElement.dataset.tema = tema
        /* Que la barra del navegador acompañe: con el color fijo en oscuro,
           en un telefono en tema claro quedaba una franja negra arriba. */
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', tema === 'claro' ? '#eef1f7' : '#05080e')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
